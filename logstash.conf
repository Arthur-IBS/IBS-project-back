input {
  http {
    port => 5000
    codec => json
    ecs_compatibility => disabled
  }
}
 
filter {
  date {
    match => ["log_timestamp", "dd.MM.yyyy HH:mm:ss"]
    target => "@timestamp"
    timezone => "Asia/Kolkata"
  }
 
  mutate {
    remove_field => ["@version", "host", "port"]
  }
}
 
output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "logpro-%{application}"
  }
  stdout {
    codec => rubydebug
  }
}
 